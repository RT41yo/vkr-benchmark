[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vkr-benchmark"
version = "0.2.0.dev0"
description = "Benchmark infrastructure for generative linguistic steganography"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
lm = [
  "torch>=2.7,<2.8",
  "transformers>=4.52,<4.53",
  "tokenizers>=0.21,<0.22",
  "safetensors>=0.5,<0.6",
  "huggingface-hub>=0.32,<0.33",
]
storage = ["pyarrow>=17,<20"]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
